services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - backend_db

  backend:
    image: harshdocs22/fest-backend:1.0.0
    environment:
      REGNO: ${REGNO:?Set REGNO in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    networks:
      - frontend_backend
      - backend_db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "${PORT:?Set PORT in .env}:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_backend

volumes:
  postgres_data:

networks:
  frontend_backend:
    driver: bridge
  backend_db:
    driver: bridge
