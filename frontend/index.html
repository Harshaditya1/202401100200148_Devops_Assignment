<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FestPass 2026 Registration</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #f3f6fb; color: #172033; }
      main { max-width: 760px; margin: 3rem auto; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 8px 28px #17203318; }
      h1 { margin-top: 0; }
      form { display: grid; gap: .8rem; max-width: 480px; }
      label { display: grid; gap: .3rem; }
      input, button { font: inherit; padding: .65rem; }
      button { cursor: pointer; border: 0; border-radius: 6px; background: #2457d6; color: white; }
      li { padding: .35rem 0; }
      #message { min-height: 1.5rem; }
      .status { color: #32506f; }
    </style>
  </head>
  <body>
    <main>
      <h1>FestPass 2026</h1>
      <p class="status">Registration number: <strong id="regno">Loading…</strong></p>
      <p class="status">Application version: <strong id="version">Loading…</strong></p>
      <p class="status">Database: <strong id="database">Checking…</strong></p>

      <h2>Register for the festival</h2>
      <form id="registration-form">
        <label>Name <input name="name" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <button type="submit">Create registration</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>

      <h2>Registrations</h2>
      <ul id="registrations"></ul>
    </main>
    <script>
      const message = document.querySelector("#message");
      const registrations = document.querySelector("#registrations");

      async function loadHealth() {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error(`Health request failed (${response.status})`);
        const health = await response.json();
        document.querySelector("#regno").textContent = health.registration_number;
        document.querySelector("#version").textContent = health.version;
        document.querySelector("#database").textContent = health.database_status ? "Connected" : "Unavailable";
      }

      async function loadRegistrations() {
        const response = await fetch("/api/registrations");
        if (!response.ok) throw new Error(`Registration list failed (${response.status})`);
        const entries = await response.json();
        registrations.replaceChildren();
        for (const entry of entries) {
          const item = document.createElement("li");
          item.textContent = `${entry.name} — ${entry.email}`;
          registrations.append(item);
        }
      }

      document.querySelector("#registration-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        const formData = new FormData(event.currentTarget);
        try {
          const response = await fetch("/api/registrations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: formData.get("name"),
              email: formData.get("email"),
            }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `Request failed (${response.status})`);
          event.currentTarget.reset();
          message.textContent = "Registration created.";
          await loadRegistrations();
        } catch (error) {
          message.textContent = error.message;
        }
      });

      Promise.all([loadHealth(), loadRegistrations()]).catch((error) => {
        message.textContent = error.message;
      });
    </script>
  </body>
</html>
